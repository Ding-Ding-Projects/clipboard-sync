name: Build and release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    env:
      PACKAGE_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable application
        shell: cmd
        run: build.bat /s
      - name: Build unsigned Squirrel.Windows installer
        shell: cmd
        run: build-installer.bat /s
      - name: Publish normal release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Record build outcome
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          @{ runId = $env:GITHUB_RUN_ID; sourceCommit = $env:GITHUB_SHA; status = $env:JOB_STATUS; runner = $env:RUNNER_OS; nativeAcceptance = 'Not established by packaging' } | ConvertTo-Json | Set-Content release/workflow-outcome.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: clipboard-sync-windows
          path: |
            release/*.exe
            release/*.nupkg
            release/RELEASES
            release/*.json
            release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: server.Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/Ding-Ding-Projects/clipboard-sync
          tags: |
            ghcr.io/ding-ding-projects/clipboard-sync-server:latest
            ghcr.io/ding-ding-projects/clipboard-sync-server:${{ github.sha }}
      - name: Record image publication
        if: ${{ always() }}
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          JOB_STATUS: ${{ job.status }}
        run: python -c 'import json,os; json.dump({k:os.environ.get(k) for k in ("SOURCE_SHA","IMAGE_DIGEST","JOB_STATUS")},open("image-receipt.json","w"))'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: server-publication
          path: image-receipt.json
          if-no-files-found: warn
          retention-days: 14
